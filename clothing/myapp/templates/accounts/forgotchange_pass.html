<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --primary-dark: #000000;
            --accent: #b89765;
            --accent-hover: #9c7d4d;
            --bg-gradient: linear-gradient(135deg, #f7f6f2 0%, #eae7e0 100%);
            --text-main: #2b2b2b;
            --text-muted: #757575;
            --border-color: #d8d5cd;
            --shadow: 0 20px 50px rgba(26, 26, 26, 0.05), 0 2px 10px rgba(26, 26, 26, 0.02);
            --border-radius: 16px;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 50px 45px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(184, 151, 101, 0.12);
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 60px rgba(26, 26, 26, 0.08), 0 4px 15px rgba(26, 26, 26, 0.03);
        }

        h2 {
            font-family: var(--font-serif);
            text-align: center;
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        input {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            background-color: #faf9f6;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(184, 151, 101, 0.15);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 12px;
        }

        button:hover {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(184, 151, 101, 0.3);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .forgot-footer {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid #f0efeb;
            padding-top: 25px;
        }

        .forgot-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s, border-bottom 0.2s;
            border-bottom: 1px solid transparent;
        }

        .forgot-footer a:hover {
            color: var(--accent);
            border-bottom: 1px solid var(--accent);
        }

        .error-alert {
            color: #c53030;
            background-color: #fff5f5;
            border: 1px solid #fed7d7;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Change Password</h2>
        <p class="subtitle">Please enter and confirm your new password below.</p>

        <form method="POST">
            {% csrf_token %}

            <input type="password"
                name="password"
                placeholder="New Password"
                required>

            <input type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>

            <button type="submit">
                Save
            </button>
        </form>

        {% if error %}
        <div class="error-alert">
            {{ error }}
        </div>
        {% endif %}

        <div class="forgot-footer">
            <p><a href="{% url 'login' %}">Back to Login</a></p>
        </div>
    </div>
</body>
</html>
