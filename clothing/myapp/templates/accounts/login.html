<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --primary-dark: #000000;
            --accent: #b89765;
            --accent-hover: #9c7d4d;
            --bg-gradient: linear-gradient(135deg, #f7f6f2 0%, #eae7e0 100%);
            --text-main: #2b2b2b;
            --text-muted: #757575;
            --border-color: #d8d5cd;
            --shadow: 0 20px 50px rgba(26, 26, 26, 0.05), 0 2px 10px rgba(26, 26, 26, 0.02);
            --border-radius: 16px;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Subtle Fade In Animation */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: var(--border-radius);
            padding: 50px 45px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(184, 151, 101, 0.12);
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 60px rgba(26, 26, 26, 0.08), 0 4px 15px rgba(26, 26, 26, 0.03);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            font-size: 46px;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 4px 8px rgba(184, 151, 101, 0.2));
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-title {
            font-family: var(--font-serif);
            color: var(--primary);
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 15px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: #faf9f6;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(184, 151, 101, 0.15);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 10px;
            border: 1px solid var(--primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 12px;
        }

        .btn-submit:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(184, 151, 101, 0.3);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 35px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid #f0efeb;
            padding-top: 25px;
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s, border-bottom 0.2s;
            border-bottom: 1px solid transparent;
        }

        .login-footer a:hover {
            color: var(--accent);
            border-bottom: 1px solid var(--accent);
        }

        .error-alert {
            color: #c53030;
            background-color: #fff5f5;
            border: 1px solid #fed7d7;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 24px;
            font-weight: 500;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <span class="login-logo">🧥</span>
            <h1 class="login-title">Clothing</h1>
            <p class="login-subtitle">Sign in to your account</p>
        </div>

        {% if error %}
        <div class="error-alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="jessiarose@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="login-footer">
            <p>
                <a href="{% url 'forgot_password' %}">Forgot Password?</a> |
                <a href="{% url 'register' %}">Register</a>
            </p>
        </div>
    </div>

</body>
</html>

<!-- {% csrf_token %} is a Django template tag.
It generates a hidden security token inside a form.
It protects your website from Cross-Site Request Forgery (CSRF) attacks.
It should be included in every Django form that uses method="POST".
If it's missing, Django will usually respond with 403 Forbidden - CSRF verification failed. -->
