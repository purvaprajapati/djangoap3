<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Blogs</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #1a1a1a;
        --accent: #b89765;
        --accent-hover: #9c7d4d;
        --bg-light: #f7f6f2;
        --card-bg: #ffffff;
        --text-dark: #1a1a1a;
        --text-muted: #757575;
        --border-color: #e5e2da;
        --shadow-sm: 0 4px 12px rgba(0,0,0,0.03);
        --shadow-md: 0 12px 30px rgba(0,0,0,0.06);
        --border-radius: 12px;
        --font-serif: 'Playfair Display', serif;
        --font-sans: 'Inter', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg-light);
        font-family: var(--font-sans);
        color: var(--text-dark);
      }

      .main-content {
        margin-left: 260px;
        padding: 50px 60px;
        min-height: 100vh;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 20px;
      }

      .add-btn {
        background: var(--primary);
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: inline-block;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .add-btn:hover {
        background: var(--accent);
        box-shadow: 0 4px 15px rgba(184, 151, 101, 0.25);
        transform: translateY(-1px);
      }

      .search-box {
        display: flex;
        gap: 12px;
      }

      .search-box input {
        width: 300px;
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        outline: none;
        font-family: inherit;
        font-size: 14px;
        background-color: #ffffff;
        transition: all 0.3s ease;
      }

      .search-box input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(184, 151, 101, 0.12);
      }

      .search-box button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .search-box button:hover {
        background: var(--accent);
      }

      /* BLOG GRID */
      .blog-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
      }

      .blog-card {
        background: var(--card-bg);
        border-radius: var(--border-radius);
        padding: 30px;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
        position: relative;
        overflow: hidden;
        min-height: 280px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
      }

      .blog-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-md);
        border-color: rgba(184, 151, 101, 0.3);
      }

      .blog-title {
        font-family: var(--font-serif);
        font-size: 24px;
        color: var(--primary);
        font-weight: 700;
        margin-bottom: 15px;
        line-height: 1.3;
        word-break: break-word;
      }

      .blog-description {
        color: var(--text-muted);
        line-height: 1.6;
        font-size: 14px;
        height: 90px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        margin-bottom: 20px;
      }

      /* BUTTONS */
      .actions {
        display: flex;
        justify-content: flex-start;
        gap: 10px;
        border-top: 1px solid #f2eff6;
        padding-top: 20px;
        margin-top: auto;
      }

      .actions a {
        text-decoration: none;
      }

      .actions button {
        border: 1px solid #e5e2da;
        color: var(--text-dark);
        background: #ffffff;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
      }

      .actions button:hover {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .actions a:nth-of-type(3) button {
        background: #fff5f5;
        color: #c53030;
        border: 1px solid #fed7d7;
      }

      .actions a:nth-of-type(3) button:hover {
        background: #c53030;
        color: white;
        border-color: #c53030;
      }

      .empty {
        grid-column: 1 / -1;
        text-align: center;
        margin-top: 100px;
        font-size: 18px;
        color: var(--text-muted);
        font-family: var(--font-serif);
      }

      @media (max-width: 992px) {
        .main-content {
          margin-left: 0;
          padding: 30px;
        }
        .top-bar {
          flex-direction: column;
          align-items: stretch;
          gap: 15px;
        }
        .search-box input {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    {% include 'includes/sidebar.html' %}

    <div class="main-content">
      <div class="top-bar">
        <a href="{% url 'add_blog' %}" class="add-btn"> + Add Blog </a>

        <form method="GET" class="search-box">
          <input
            type="text"
            name="q"
            placeholder="Search Blog..."
            value="{{ request.GET.q }}"
          />

          <button>Search</button>
        </form>
      </div>

      <div class="blog-container">
        {% for blog in blogs %}

        <div class="blog-card">
          <div class="blog-title">{{ blog.title }}</div>

          <div class="blog-description">
            {{ blog.description|truncatewords:45 }}
          </div>

          <div class="actions">
            <a href="{% url 'view_blog' blog.id %}">
              <button class="view"> View</button>
            </a>

            <a href="{% url 'edit_blog' blog.id %}">
              <button class="edit">Edit</button>
            </a>

            <a
              href="{% url 'delete_blog' blog.id %}"
              onclick="return confirm('Delete this blog?');"
            >
              <button class="delete"> Delete</button>
            </a>
          </div>
        </div>

        {% empty %}

        <div class="empty">📄 No Blogs Added Yet</div>

        {% endfor %}
      </div>
    </div>
  </body>
</html>
