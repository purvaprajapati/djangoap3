<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clothing Store - Contact Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #b89765;
            --accent-hover: #9c7d4d;
            --bg-gradient: linear-gradient(135deg, #f7f6f2 0%, #eae7e0 100%);
            --text-main: #2b2b2b;
            --text-muted: #757575;
            --border-color: #d8d5cd;
            --shadow: 0 20px 50px rgba(26, 26, 26, 0.05), 0 2px 10px rgba(26, 26, 26, 0.02);
            --border-radius: 16px;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 50px 45px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(184, 151, 101, 0.12);
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 60px rgba(26, 26, 26, 0.08), 0 4px 15px rgba(26, 26, 26, 0.03);
        }

        h2 {
            font-family: var(--font-serif);
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .info-group {
            border-top: 1px solid #f2eff6;
            margin-top: 15px;
            padding-top: 10px;
            margin-bottom: 30px;
        }

        p.detail-row {
            font-size: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #f9f9f9;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }

        p.detail-row b {
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        p.detail-row span {
            font-weight: 600;
            color: var(--primary);
        }

        .btn-back {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            width: 100%;
        }

        .btn-back:hover {
            background: var(--accent);
            box-shadow: 0 6px 20px rgba(184, 151, 101, 0.25);
            transform: translateY(-1px);
        }

        .footer-link {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid #f0efeb;
            padding-top: 25px;
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s, border-bottom 0.2s;
            border-bottom: 1px solid transparent;
        }

        .footer-link a:hover {
            color: var(--accent);
            border-bottom: 1px solid var(--accent);
        }
  </head>
  <body>
    <div class="container">
        <h2>Contact Details</h2>
        <div class="info-group">
            <p class="detail-row">Name: <span>{{contact.name}}</span></p>
            <p class="detail-row">Contact: <span>{{contact.contact_no}}</span></p>
        </div>

        <div class="footer-link">
            <p><a href="{% url 'contacts' %}">Back to Contacts</a></p>
        </div>
    </div>
  </body>
</html>
