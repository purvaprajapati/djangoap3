<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #1a1a1a;
        --accent: #b89765;
        --bg-light: #f7f6f2;
        --card-bg: #ffffff;
        --text-dark: #1a1a1a;
        --border-color: #e5e2da;
        --font-serif: 'Playfair Display', serif;
        --font-sans: 'Inter', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg-light);
        font-family: var(--font-sans);
        color: var(--text-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .login-card {
        background: var(--card-bg);
        padding: 45px 40px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        width: 100%;
        max-width: 420px;
      }

      .login-card h2 {
        font-family: var(--font-serif);
        font-size: 28px;
        font-weight: 700;
        color: var(--primary);
        text-align: center;
        margin-bottom: 8px;
      }

      .login-card p.subtitle {
        text-align: center;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 30px;
      }

      .error-msg {
        background: #fff5f5;
        color: #c53030;
        border: 1px solid #fed7d7;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 20px;
        text-align: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #757575;
        margin-bottom: -10px;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        background-color: #fafafa;
        transition: all 0.3s ease;
      }

      input[type="email"]:focus,
      input[type="password"]:focus {
        border-color: var(--accent);
        background-color: #ffffff;
      }

      button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      button:hover {
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>Admin Panel</h2>
      <p class="subtitle">Custom Control Center</p>

      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <label>Admin Email</label>
        <input type="email" name="email" value="admin@gmail.com" placeholder="admin@gmail.com" required />

        <label>Password</label>
        <input type="password" name="password" value="admin" placeholder="Password" required />

        <button type="submit">Log In to Admin</button>
      </form>
    </div>
  </body>
</html>
